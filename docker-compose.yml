version: '3.8'

services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: log_analyzer_db
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8123:8123" # HTTP port
      - "9000:9000" # Native port
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5

    environment:
      - CLICKHOUSE_PASSWORD=default_password
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1

  app:
    build: .
    container_name: log_analyzer_app
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - ./src:/app/src
      - ./docs:/app/docs
      - ./GeoLite2-Country.mmdb:/app/GeoLite2-Country.mmdb
    ports:
      - "8501:8501"
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_PASSWORD=default_password

volumes:
  clickhouse_data:
